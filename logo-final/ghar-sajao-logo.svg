<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 340" width="790" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b766"/><stop offset=".5" stop-color="#c08f45"/><stop offset="1" stop-color="#9a6b2c"/></linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6b2c"/><stop offset=".5" stop-color="#e6c178"/><stop offset="1" stop-color="#9a6b2c"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="790" height="340" fill="#ffffff"/>

<!-- ===== ICON: arc floor lamp + wingback armchair + plant ===== -->
<g transform="translate(18 24)">
  <!-- lamp light cone -->
  <path d="M150 74 L108 196 H222 Z" fill="url(#glow)"/>
  <!-- arc lamp -->
  <path d="M30 262 V120 Q30 30 150 34 V52" fill="none" stroke="#1f1c19" stroke-width="7" stroke-linecap="round"/>
  <path d="M18 266 H44" stroke="#1f1c19" stroke-width="8" stroke-linecap="round"/>
  <path d="M122 76 Q150 46 178 76 Z" fill="#1f1c19"/>
  <circle cx="150" cy="80" r="5" fill="#f2c96e"/>

  <!-- wingback chair -->
  <path d="M84 142 Q84 104 124 100 H176 Q216 104 216 142 V206 H84 Z" fill="url(#gold)"/>
  <!-- wings / arms -->
  <path d="M64 176 Q64 152 88 152 Q102 152 102 172 V236 H64 Z" fill="url(#gold)" stroke="#fff" stroke-width="3"/>
  <path d="M236 176 Q236 152 212 152 Q198 152 198 172 V236 H236 Z" fill="url(#gold)" stroke="#fff" stroke-width="3"/>
  <!-- seat cushion -->
  <rect x="96" y="200" width="108" height="30" rx="10" fill="#1f1c19"/>
  <path d="M108 210 H192" stroke="#c08f45" stroke-width="2" stroke-dasharray="4 5" opacity=".9"/>
  <!-- tufting -->
  <g fill="#1f1c19" opacity=".85"><circle cx="128" cy="130" r="4"/><circle cx="150" cy="122" r="4"/><circle cx="172" cy="130" r="4"/><circle cx="139" cy="156" r="4"/><circle cx="161" cy="156" r="4"/><circle cx="150" cy="182" r="4"/><circle cx="128" cy="180" r="4"/><circle cx="172" cy="180" r="4"/></g>
  <!-- base + legs -->
  <rect x="60" y="234" width="180" height="12" rx="6" fill="#1f1c19"/>
  <path d="M78 246 L72 270 M222 246 L228 270" stroke="#1f1c19" stroke-width="7" stroke-linecap="round"/>
  <!-- plant -->
  <path d="M262 206 h30 l-5 40 h-20 z" fill="#1f1c19"/>
  <path d="M277 206 Q262 176 248 168 Q270 170 277 196 Q280 160 300 146 Q290 176 281 206" fill="#c08f45"/>
  <path d="M279 206 Q296 186 312 184 Q300 196 283 208" fill="#9a6b2c"/>
  <!-- floor line -->
  <path d="M10 278 H312" stroke="#c08f45" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- ===== WORDMARK ===== -->
<!-- roof over GHAR -->
<path d="M340 68 L514 16 L688 68" fill="none" stroke="#1f1c19" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="616" y="26" width="16" height="26" fill="#1f1c19"/>
<path d="M514 40 l9 9 -9 9 -9 -9z" fill="#c08f45"/>

<text x="346" y="160" font-family="Montserrat,Arial Black,sans-serif" font-weight="800" font-size="104" fill="url(#gold)" letter-spacing="3">GHAR</text>

<!-- divider with diamond -->
<path d="M348 180 H530" stroke="#1f1c19" stroke-width="5" stroke-linecap="round"/>
<path d="M541 180 l9 -9 9 9 -9 9z" fill="#c08f45"/>
<path d="M570 180 H752" stroke="#1f1c19" stroke-width="5" stroke-linecap="round"/>

<text x="344" y="276" font-family="Montserrat,Arial Black,sans-serif" font-weight="800" font-size="104" fill="#1f1c19" letter-spacing="7">SAJAO</text>

<!-- tagline ribbon -->
<rect x="344" y="294" width="411" height="34" rx="17" fill="#1f1c19"/>
<text x="550" y="316.5" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="600" font-size="13.5" fill="#e2b766" letter-spacing="3.6">INTERIORS  ◆  THE DREAM SPACE</text>
</svg>
